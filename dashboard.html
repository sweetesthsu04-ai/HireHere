<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Seeker Dashboard — HireHere.com</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">HireHere.com</a>
      <button type="button" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span></button>
      <nav id="main-nav" class="main-nav" aria-label="Primary"></nav>
    </div>
  </header>
  <main id="main" class="container" style="padding: 2rem 0 3rem;">
    <h1 id="dash-welcome">Welcome</h1>
    <p class="muted">Track saved jobs and applications on HireHere.com.</p>
    <div class="stats-grid" id="seeker-stats"></div>
    <h2>Recent applications</h2>
    <div id="recent-apps"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
